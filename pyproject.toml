#############################
# Build configuration (PEP 517)
#############################
[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


#############################
# Project metadata (PEP 621)
#############################
[project]
name = "filemate"
version = "0.0.1"
description = "A NAS FileSystem management tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "LounisBou", email = "lounis.bou@gmail.com" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
dependencies = [
  "bigtree",
  "python-dotenv",
  "pydevmate",
  "redis",
  "diskcache",
  "psutil",
  "termcolor",
]

[project.urls]
Homepage = "https://github.com/LounisBou/filemate"

# [project.scripts]
# filemate = "filemate.__main__:main"


#############################
# Setuptools configuration
#############################
[tool.setuptools]
packages = ["filemate"]


#############################
# Tooling configuration
#############################

# Black code formatter
[tool.black]
line-length = 99
target-version = ["py39", "py310", "py311", "py312"]
exclude = '''
(
  /(
      \.git
    | \.venv
    | build
    | dist
    | \.mypy_cache
    | \.pytest_cache
  )/
)
'''

# isort to sort imports (compatible with black)
[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["filemate"]
known_third_party = [
    "bigtree",
    "dotenv",
    "pydevmate",
    "redis",
    "diskcache",
    "psutil",
    "termcolor",
]
combine_as_imports = true

# mypy static type checker
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_context = true
pretty = true
